name: PR Slash Commands

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  actions: write

jobs:
  handle-command:
    runs-on: ubuntu-latest
    # Only run on pull requests (not standard issues) and when comment starts with "/"
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/') }}
    steps:
      - name: Process Command
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment.body.trim();
            const commentUser = context.payload.comment.user.login;
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Check roles
            const authorAssociation = context.payload.comment.author_association;
            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(authorAssociation);
            
            console.log(`Processing command: ${commentBody} from user: ${commentUser} (${authorAssociation})`);
            
            // 1. /help command
            if (commentBody === '/help') {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: context.payload.comment.id, content: 'rocket'
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `### 🤖 SentinelX PR Automation Bot\n\nHere is the list of available commands:\n\n| Command | Allowed Users | Effect |\n| :--- | :--- | :--- |\n| \`/help\` | Anyone | List available commands |\n| \`/retest\` | Anyone | Re-run failed CI checks on this PR |\n| \`/close\` | Author or Maintainer | Close this Pull Request |\n| \`/approve\` | Maintainer | Approve the PR and add the \`approved\` label |\n| \`/merge\` | Maintainer | Squash-merge the PR |\n`
              });
              return;
            }
            
            // 2. /retest command
            if (commentBody === '/retest') {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: context.payload.comment.id, content: 'eyes'
              });
              
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: issueNumber
              });
              const headBranch = pr.head.ref;
              
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, branch: headBranch, per_page: 50
              });
              
              const failedRuns = runs.workflow_runs.filter(run => 
                run.status === 'completed' && ['failure', 'cancelled', 'timed_out'].includes(run.conclusion)
              );
              
              if (failedRuns.length === 0) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `💬 @${commentUser} No failed workflow runs found to retest.`
                });
                return;
              }
              
              for (const run of failedRuns) {
                await github.rest.actions.reRunWorkflow({
                  owner, repo, run_id: run.id
                });
              }
              
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `🔄 @${commentUser} Re-triggering ${failedRuns.length} failed workflow runs...`
              });
              return;
            }
            
            // 3. /close command
            if (commentBody === '/close') {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: issueNumber
              });
              const isAuthor = pr.user.login === commentUser;
              
              if (isMaintainer || isAuthor) {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: '+1'
                });
                await github.rest.pulls.update({
                  owner, repo, pull_number: issueNumber, state: 'closed'
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `🔒 Pull Request closed by @${commentUser}.`
                });
              } else {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: 'confused'
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `⚠️ @${commentUser} You are not authorized to close this PR. Only the author or maintainers can close it.`
                });
              }
              return;
            }
            
            // 4. /approve command
            if (commentBody === '/approve') {
              if (isMaintainer) {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: '+1'
                });
                await github.rest.pulls.createReview({
                  owner, repo, pull_number: issueNumber, event: 'APPROVE',
                  body: `Approved via \`/approve\` command by @${commentUser}.`
                });
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels: ['approved']
                });
              } else {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: 'confused'
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `⚠️ @${commentUser} You are not authorized to approve pull requests. Maintainer status required.`
                });
              }
              return;
            }
            
            // 5. /merge command
            if (commentBody === '/merge') {
              if (isMaintainer) {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: 'eyes'
                });
                
                const { data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: issueNumber
                });
                
                // Check if PR is mergeable
                if (pr.mergeable === false || pr.mergeable_state === 'blocked') {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNumber,
                    body: `⚠️ @${commentUser} Cannot merge PR. The merge is currently blocked by failing checks, merge conflicts, or missing reviews.`
                  });
                  return;
                }
                
                await github.rest.pulls.merge({
                  owner, repo, pull_number: issueNumber, merge_method: 'squash',
                  commit_title: `${pr.title} (#${issueNumber})`,
                  commit_message: `Merged via \`/merge\` command by @${commentUser}.`
                });
              } else {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: 'confused'
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `⚠️ @${commentUser} You are not authorized to merge pull requests. Maintainer status required.`
                });
              }
              return;
            }
